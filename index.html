<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icseon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
    <div class="stars" id="stars"></div>
    <div id="darkVeil"></div>

    <div id="enter" class="loading">
      <div class="tap">tap to enter</div>
      <div class="loadbar" id="loadBar"><i></i></div>
      <div class="hint" id="loadHint">loading&hellip;</div>
    </div>

    <button id="music" title="toggle lofi"><span class="note">🎵</span></button>
    <audio id="audio" loop preload="none" src="assets/audio/lofi-loop.mp3"></audio>
    <audio id="bloop" preload="none" src="assets/audio/reveal-bloop.mp3"></audio>
    <audio id="denySound" preload="none" src="assets/audio/deny-error.mp3"></audio>
    <audio id="happySound" preload="none" src="assets/audio/greet-beep.mp3"></audio>
    <audio id="typeSound" preload="none" src="assets/audio/type-tick.wav"></audio>

    <div class="wrap">
      <div class="stage">
        <div class="card">
          <div class="avatar-beat" id="avatarBeat">
            <div class="avatar-ring">
              <div class="avatar-ph" id="avatar">🌸</div>
              <span class="status-dot offline" id="statusDot"></span>
            </div>
          </div>

          <div class="name">Icseon</div>

          <div class="activity" id="dActivity" hidden>
            <img class="art" id="actArt" alt="" hidden />
            <div class="actmeta">
              <div class="actlabel" id="actLabel"></div>
              <div class="acttitle" id="actName"></div>
              <div class="actline" id="actDetails" hidden></div>
              <div class="actline" id="actState" hidden></div>
              <div class="actelapsed" id="actElapsed" hidden></div>
            </div>
          </div>

          <p class="reach" id="reach"></p>

          <div class="links-wrap" id="linksWrap">
            <div class="links-inner">
              <hr class="rule" />

              <div class="socials">
                <a href="#" id="emailBtn" aria-label="Email" data-tip="send a message">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2 8-5.2H4l8 5.2zM4 8.3V17h16V8.3l-8 5.2-8-5.2z"
                    />
                  </svg>
                </a>
                <a href="https://x.com/icseon" target="_blank" aria-label="X" data-tip="@icseon">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M18.9 2H22l-7.3 8.3L23 22h-6.8l-5.3-6.9L4.8 22H1.7l7.8-8.9L1 2h7l4.8 6.3L18.9 2zm-2.4 18h1.9L7.5 4H5.5l11 16z"
                    />
                  </svg>
                </a>
                <a
                  href="https://github.com/Icseon"
                  target="_blank"
                  aria-label="GitHub"
                  data-tip="github"
                >
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2z"
                    />
                  </svg>
                </a>
                <a
                  href="https://icseon.com"
                  target="_blank"
                  aria-label="Website"
                  data-tip="icseon.com"
                >
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.7 15.7 0 0 0-1.3-3.4A8 8 0 0 1 18.9 8zM12 4c.8 1.1 1.4 2.5 1.8 4h-3.6c.4-1.5 1-2.9 1.8-4zM4.3 14a7.8 7.8 0 0 1 0-4h3.3a17.6 17.6 0 0 0 0 4H4.3zm.8 2h2.9c.3 1.2.8 2.4 1.3 3.4A8 8 0 0 1 5.1 16zm2.9-8H5.1a8 8 0 0 1 4.2-3.4C8.8 5.6 8.3 6.8 8 8zM12 20c-.8-1.1-1.4-2.5-1.8-4h3.6c-.4 1.5-1 2.9-1.8 4zm2.2-6H9.8a15.4 15.4 0 0 1 0-4h4.4a15.4 15.4 0 0 1 0 4zm.5 5.4c.5-1 1-2.2 1.3-3.4h2.9a8 8 0 0 1-4.2 3.4zM16.4 14a17.6 17.6 0 0 0 0-4h3.3a7.8 7.8 0 0 1 0 4h-3.3z"
                    />
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>

        <aside class="email-card" id="emailCard" role="dialog" aria-label="Send a message" hidden>
          <button class="modal-close" id="mailClose" aria-label="Close">×</button>
          <div id="emailForm">
            <div class="modal-title">say hi</div>
            <div class="modal-sub">drop me a little message</div>
            <label class="field">
              <span id="nameLabel">Discord username</span>
              <div class="input-wrap">
                <input type="text" id="mailName" maxlength="80" autocomplete="off" />
                <span class="spinner" id="nameSpin" hidden></span>
              </div>
            </label>
            <label class="field">
              <span>Subject</span>
              <input
                type="text"
                id="mailSubject"
                placeholder="hello!"
                maxlength="120"
                autocomplete="off"
              />
            </label>
            <label class="field">
              <span>Message</span>
              <textarea
                id="mailBody"
                placeholder="write something…"
                rows="4"
                maxlength="2000"
              ></textarea>
            </label>
            <button class="modal-send" id="mailSend">send</button>
          </div>
          <div id="friendView" hidden>
            <div class="modal-title">i know you!</div>
            <div class="modal-sub">send me a friend request on Discord</div>
            <div class="fr-user">
              <svg viewBox="0 0 24 24">
                <path
                  d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"
                />
              </svg>
              <span>icseon</span>
            </div>
            <button class="modal-send" id="frCopy">copy username</button>
          </div>
        </aside>
      </div>
    </div>
    <script src="assets/js/app.js"></script>
  </body>
</html>
